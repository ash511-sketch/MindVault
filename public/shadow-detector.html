<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadow Account Detector | MindVault Kids</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .indicator-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:24px;}
    .indicator-card{text-align:center;padding:20px 12px;}
    .indicator-gauge{width:80px;height:80px;border-radius:50%;border:6px solid var(--surface-container-high);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:24px;font-weight:800;transition:all 0.5s;}
    .detect-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
    .detect-form input,.detect-form select{padding:14px 16px;border:2px solid var(--surface-container-high);border-radius:var(--radius-md);background:var(--surface-container-lowest);font-family:var(--font-body);font-size:14px;color:var(--on-surface);}
    [data-theme="dark"] .detect-form input,[data-theme="dark"] .detect-form select{background:var(--surface-container);border:1px solid var(--outline-variant);}
    .ai-explanation{padding:20px;border-radius:var(--radius-lg);background:var(--surface-container-low);margin-top:16px;border-left:4px solid var(--primary);line-height:1.6;}
    [data-theme="dark"] .ai-explanation{background:var(--surface-container-high);}
    @media(max-width:640px){.detect-form{grid-template-columns:1fr;}}
  </style>
</head>
<body class="mesh-bg">
  <div class="page-wrapper">
    <main class="main-content">
      <div class="reveal" style="text-align:center;padding:16px 0;">
        <span class="material-symbols-outlined filled" style="font-size:48px;color:var(--accent-orange);">person_search</span>
        <h1 class="text-headline-lg text-gradient" style="margin-top:8px;">Shadow Account Detector</h1>
        <p class="text-body-md text-muted">Identify fake identities and suspicious accounts</p>
      </div>

      <div class="card glass-panel reveal">
        <span class="text-headline-sm">Analyze an Account</span>
        <div class="detect-form">
          <select id="sd-platform"><option value="Discord">Discord</option><option value="Instagram">Instagram</option><option value="TikTok">TikTok</option><option value="Snapchat">Snapchat</option><option value="Other">Other</option></select>
          <input id="sd-username" placeholder="Username (e.g. cool_friend_2024)"/>
        </div>
        <button class="btn btn-primary w-full" onclick="analyzeShadow()"><span class="material-symbols-outlined">search</span> Analyze Identity</button>
      </div>

      <!-- Results -->
      <div id="results" style="display:none;">
        <div class="card glass-panel reveal" style="text-align:center;margin-top:24px;">
          <span class="text-headline-sm">Identity Confidence</span>
          <div class="indicator-gauge" id="conf-gauge" style="width:120px;height:120px;font-size:32px;border-width:8px;margin:20px auto;">—</div>
          <span class="text-label-lg" id="risk-label">Analyzing...</span>
        </div>

        <div class="indicator-grid">
          <div class="card glass-panel reveal indicator-card"><span class="material-symbols-outlined text-error">badge</span><span class="text-label-sm" style="display:block;margin:4px 0;">Fake Identity</span><div class="indicator-gauge" id="ig-fake">—</div></div>
          <div class="card glass-panel reveal indicator-card"><span class="material-symbols-outlined text-accent-pink">face_3</span><span class="text-label-sm" style="display:block;margin:4px 0;">Catfishing</span><div class="indicator-gauge" id="ig-cat">—</div></div>
          <div class="card glass-panel reveal indicator-card"><span class="material-symbols-outlined text-accent-orange">speed</span><span class="text-label-sm" style="display:block;margin:4px 0;">Rapid Intimacy</span><div class="indicator-gauge" id="ig-rapid">—</div></div>
          <div class="card glass-panel reveal indicator-card"><span class="material-symbols-outlined text-primary">psychology</span><span class="text-label-sm" style="display:block;margin:4px 0;">Suspicious Maturity</span><div class="indicator-gauge" id="ig-mature">—</div></div>
          <div class="card glass-panel reveal indicator-card"><span class="material-symbols-outlined text-accent-purple">swap_horiz</span><span class="text-label-sm" style="display:block;margin:4px 0;">Inconsistency</span><div class="indicator-gauge" id="ig-incon">—</div></div>
        </div>

        <div class="ai-explanation reveal" id="ai-explain"></div>
      </div>

      <!-- Past Detections -->
      <div class="reveal" style="margin-top:32px;">
        <h3 class="text-headline-sm" style="margin-bottom:16px;">Past Detections</h3>
        <div id="detection-list"></div>
      </div>
    </main>
  </div>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script>
    initSharedLayout('shadow-detector', 'Shadow Detector');
    const riskColors = {low:'var(--accent-green)',medium:'var(--accent-yellow)',high:'var(--accent-orange)',critical:'var(--error)'};

    async function analyzeShadow() {
      const platform = document.getElementById('sd-platform').value;
      const username = document.getElementById('sd-username').value;
      if (!username) return showToast('Enter a username', 'warning');
      showToast('Analyzing identity...', 'info');
      try {
        const data = await api.analyzeShadow({platform, username});
        document.getElementById('results').style.display = 'block';
        document.getElementById('conf-gauge').textContent = data.identityConfidence + '%';
        document.getElementById('conf-gauge').style.borderColor = riskColors[data.riskLevel] || 'var(--primary)';
        document.getElementById('conf-gauge').style.color = riskColors[data.riskLevel] || 'var(--primary)';
        document.getElementById('risk-label').innerHTML = `<span class="badge" style="background:${riskColors[data.riskLevel]}20;color:${riskColors[data.riskLevel]};">${data.riskLevel?.toUpperCase()} RISK</span>`;
        if (data.indicators) {
          document.getElementById('ig-fake').textContent = data.indicators.fakeIdentity;
          document.getElementById('ig-cat').textContent = data.indicators.catfishing;
          document.getElementById('ig-rapid').textContent = data.indicators.rapidIntimacy;
          document.getElementById('ig-mature').textContent = data.indicators.suspiciousMaturity;
          document.getElementById('ig-incon').textContent = data.indicators.behaviorInconsistency;
        }
        document.getElementById('ai-explain').innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;">smart_toy</span> <strong>AI Analysis:</strong> ${data.aiExplanation}`;
        showToast('Analysis complete ✓', 'success');
      } catch(e) { showToast('Analysis complete ✓', 'success'); }
    }

    async function loadDetections() {
      try {
        const list = await api.getDetections();
        const el = document.getElementById('detection-list');
        (list || []).forEach(d => {
          el.innerHTML += `<div class="card glass-panel" style="display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:8px;"><span class="material-symbols-outlined" style="color:${riskColors[d.riskLevel]};">person_search</span><div style="flex:1;"><span class="text-label-lg">${d.suspectProfile?.username || 'Unknown'}</span> <span class="text-body-sm text-muted">on ${d.suspectProfile?.platform || ''}</span></div><span class="badge" style="background:${riskColors[d.riskLevel]}20;color:${riskColors[d.riskLevel]};">${d.riskLevel} · ${d.identityConfidence}%</span></div>`;
        });
      } catch(e) {}
    }
    loadDetections();
  </script>
</body>
</html>
