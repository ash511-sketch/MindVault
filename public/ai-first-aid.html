<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Emotional First Aid | MindVault Kids</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .chat-container{display:flex;flex-direction:column;height:calc(100vh - 200px);max-height:700px;}
    .chat-header{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--surface-container-high);}
    .chat-header-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 0 12px rgba(79,219,200,0.3);}
    .chat-header-avatar img{width:100%;height:100%;object-fit:cover;}
    .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .chat-input-bar{display:flex;gap:12px;padding:16px 20px;border-top:1px solid var(--surface-container-high);}
    .chat-input-bar input{flex:1;padding:14px 20px;border:2px solid var(--surface-container-high);border-radius:var(--radius-full);background:var(--surface-container-lowest);font-family:var(--font-body);font-size:15px;color:var(--on-surface);}
    [data-theme="dark"] .chat-input-bar input{background:var(--surface-container);border:1px solid var(--outline-variant);}
    .exercises-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:24px;}
    .exercise-card{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;transition:all 0.3s;}
    .exercise-card:hover{transform:translateY(-4px);}
    .exercise-icon{width:44px;height:44px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:var(--primary-fixed);}
    [data-theme="dark"] .exercise-icon{background:rgba(192,193,255,0.1);}
    .typing-indicator{display:flex;align-items:center;gap:4px;padding:8px 16px;align-self:flex-start;}
    .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--outline);animation:breathe 1.5s infinite;}
    .typing-dot:nth-child(2){animation-delay:0.2s;}
    .typing-dot:nth-child(3){animation-delay:0.4s;}
  </style>
</head>
<body class="mesh-bg">
  <div class="aurora-bg"></div>
  <div class="page-wrapper">
    <main class="main-content">
      <div class="card glass-panel chat-container reveal">
        <!-- Header -->
        <div class="chat-header">
          <div class="chat-header-avatar">
            <img src="/assets/guardian.png" alt="AI Companion" class="ai-guardian-3d"/>
          </div>
          <div>
            <span class="text-label-lg">AI Emotional Companion</span>
            <br/><span class="text-body-sm text-muted">Always here for you 💙</span>
          </div>
          <div style="margin-left:auto;display:flex;gap:8px;">
            <button class="icon-btn" onclick="startGrounding()" title="Grounding Exercise"><span class="material-symbols-outlined">spa</span></button>
            <button class="icon-btn" onclick="clearChat()" title="New Chat"><span class="material-symbols-outlined">add</span></button>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chat-messages">
          <div class="chat-bubble chat-bubble-ai" style="opacity:1;">
            Hi there! 🌟 I'm your AI companion. This is a safe, private space just for you. How are you feeling today?
          </div>
        </div>

        <!-- Input -->
        <div class="chat-input-bar">
          <input id="chat-input" placeholder="Type how you're feeling..." onkeydown="if(event.key==='Enter')sendMessage()"/>
          <button class="btn btn-primary" onclick="sendMessage()" style="padding:14px 24px;"><span class="material-symbols-outlined">send</span></button>
        </div>
      </div>

      <!-- Exercises -->
      <h3 class="text-headline-sm reveal" style="margin-top:32px;margin-bottom:12px;">Calming Exercises</h3>
      <div class="exercises-panel" id="exercises"></div>
    </main>
  </div>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script>
    initSharedLayout('ai-first-aid', 'AI Emotional First Aid');
    const sessionId = 'session-' + Date.now();

    function showTyping() {
      const chat = document.getElementById('chat-messages');
      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.id = 'typing';
      typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;
    }
    function hideTyping() { document.getElementById('typing')?.remove(); }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      const chat = document.getElementById('chat-messages');
      chat.innerHTML += `<div class="chat-bubble chat-bubble-user" style="opacity:1;">${msg}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;
      showTyping();
      try {
        const data = await api.sendChat(msg, sessionId);
        hideTyping();
        chat.innerHTML += `<div class="chat-bubble chat-bubble-ai" style="opacity:1;">${data.response}</div>`;
      } catch(e) {
        hideTyping();
        chat.innerHTML += `<div class="chat-bubble chat-bubble-ai" style="opacity:1;">I hear you, and your feelings are completely valid. Take a deep breath with me — in for 4, hold for 4, out for 4. 💙</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function clearChat() {
      document.getElementById('chat-messages').innerHTML = '<div class="chat-bubble chat-bubble-ai" style="opacity:1;">Hi there! 🌟 Let\'s start fresh. How can I help you today?</div>';
      showToast('New chat started', 'info');
    }

    async function startGrounding() {
      showToast('Starting grounding exercise...', 'info');
      const chat = document.getElementById('chat-messages');
      try {
        const data = await api.getGroundingExercise();
        let html = `<div class="chat-bubble chat-bubble-ai" style="opacity:1;"><strong>🧘 ${data.exercise}</strong> (${data.duration})<br/><br/>`;
        (data.steps||[]).forEach(s => { html += `<strong>${s.sense}:</strong> ${s.instruction}<br/>`; });
        html += '</div>';
        chat.innerHTML += html;
        chat.scrollTop = chat.scrollHeight;
      } catch(e) {
        chat.innerHTML += '<div class="chat-bubble chat-bubble-ai" style="opacity:1;">🧘 <strong>5-4-3-2-1 Senses</strong><br/><br/>See 5 things, Touch 4 things, Hear 3 things, Smell 2 things, Taste 1 thing.</div>';
        chat.scrollTop = chat.scrollHeight;
      }
    }

    // Load exercises
    async function loadExercises() {
      const exerciseData = [
        {name:'5-4-3-2-1 Senses',type:'grounding',duration:'3 min',icon:'spa'},
        {name:'Box Breathing',type:'breathing',duration:'4 min',icon:'air'},
        {name:'Body Scan',type:'relaxation',duration:'5 min',icon:'accessibility_new'},
        {name:'Safe Place',type:'visualization',duration:'5 min',icon:'landscape'},
        {name:'Affirmations',type:'cognitive',duration:'2 min',icon:'favorite'}
      ];
      const el = document.getElementById('exercises');
      exerciseData.forEach(ex => {
        el.innerHTML += `<div class="card glass-panel exercise-card reveal" onclick="showToast('Starting ${ex.name}...','info')"><div class="exercise-icon"><span class="material-symbols-outlined text-primary">${ex.icon}</span></div><div><span class="text-label-lg">${ex.name}</span><br/><span class="text-body-sm text-muted">${ex.type} · ${ex.duration}</span></div></div>`;
      });
    }
    loadExercises();
  </script>
</body>
</html>
