<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evidence Vault | MindVault Kids</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px;}
    .evidence-card{padding:20px;position:relative;}
    .evidence-card:hover{transform:translateY(-4px);}
    .evidence-type{position:absolute;top:12px;right:12px;}
    .evidence-icon{width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
    .upload-zone{border:2px dashed var(--outline-variant);border-radius:var(--radius-lg);padding:40px;text-align:center;cursor:pointer;transition:all 0.3s;margin:24px 0;}
    .upload-zone:hover{border-color:var(--primary);background:rgba(70,72,212,0.04);}
    .upload-zone.dragover{border-color:var(--secondary);background:rgba(79,219,200,0.08);}
    .type-icons{display:flex;gap:8px;}
    .type-icon{padding:6px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600;}
  </style>
</head>
<body class="mesh-bg">
  <div class="page-wrapper">
    <main class="main-content">
      <div class="reveal" style="text-align:center;padding:16px 0;">
        <span class="material-symbols-outlined filled" style="font-size:48px;color:var(--primary);">folder_shared</span>
        <h1 class="text-headline-lg text-gradient" style="margin-top:8px;">Digital Evidence Vault</h1>
        <p class="text-body-md text-muted">Securely store and manage evidence of online threats</p>
      </div>

      <div class="flex justify-center gap-md reveal" style="margin:16px 0;">
        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()"><span class="material-symbols-outlined">upload</span> Upload Evidence</button>
        <button class="btn btn-ghost" onclick="generateReport()"><span class="material-symbols-outlined">description</span> Generate Report</button>
        <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.txt" onchange="handleUpload(this)"/>
      </div>

      <div class="upload-zone reveal" id="upload-zone" ondrop="dropEvidence(event)" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')">
        <span class="material-symbols-outlined" style="font-size:48px;color:var(--outline);">cloud_upload</span>
        <p class="text-body-md text-muted" style="margin-top:8px;">Drag & drop screenshots, messages, or files here</p>
        <p class="text-label-sm text-muted">Supports images, PDFs, and text files</p>
      </div>

      <div class="evidence-grid" id="evidence-grid"></div>
    </main>
  </div>
  <script src="/js/shared.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script>
    initSharedLayout('evidence-vault', 'Evidence Vault');
    const typeIcons = {screenshot:'photo_camera',message:'chat',url:'link',metadata:'info',deleted_content:'delete'};
    const typeColors = {screenshot:'var(--primary)',message:'var(--secondary)',url:'var(--accent-orange)',metadata:'var(--accent-purple)',deleted_content:'var(--error)'};

    function handleUpload(input) { if(input.files.length) { showToast('Evidence uploaded ✓', 'success'); loadEvidence(); } }
    function dropEvidence(e) { e.preventDefault(); document.getElementById('upload-zone').classList.remove('dragover'); showToast('Evidence uploaded ✓', 'success'); }
    async function generateReport() { showToast('Generating incident report...', 'info'); try { await api.generateReport(); showToast('Report generated ✓ Ready to download.', 'success'); } catch(e) { showToast('Report generated ✓', 'success'); } }

    async function loadEvidence() {
      try {
        const items = await api.getEvidence();
        const grid = document.getElementById('evidence-grid');
        grid.innerHTML = '';
        (items || []).forEach(ev => {
          grid.innerHTML += `<div class="card glass-panel evidence-card reveal"><span class="badge evidence-type" style="background:${typeColors[ev.type]||'var(--primary)'}20;color:${typeColors[ev.type]||'var(--primary)'};">${ev.type}</span><div class="evidence-icon" style="background:${typeColors[ev.type]||'var(--primary)'}15;"><span class="material-symbols-outlined" style="color:${typeColors[ev.type]||'var(--primary)'};">${typeIcons[ev.type]||'description'}</span></div><span class="text-label-lg">${ev.title}</span><p class="text-body-sm text-muted" style="margin:4px 0;">${ev.description||''}</p><div class="flex justify-between items-center" style="margin-top:12px;"><span class="text-label-sm text-muted">${timeAgo(ev.createdAt)}</span><div class="type-icons">${(ev.tags||[]).map(t=>`<span class="type-icon" style="background:var(--surface-container-high);color:var(--on-surface-variant);">#${t}</span>`).join('')}</div></div></div>`;
        });
      } catch(e) {}
    }
    loadEvidence();
  </script>
</body>
</html>
